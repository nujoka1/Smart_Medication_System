<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="white"/>
  <style>
    .box{fill:white;stroke:#111;stroke-width:2;rx:18;ry:18}.t{font:700 24px Arial;fill:#111}.s{font:16px Arial;fill:#333}.l{stroke:#111;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
  <text x="600" y="42" text-anchor="middle" class="t">MedSystem — System Architecture</text>

  <rect class="box" x="70" y="95" width="280" height="110"/>
  <text x="210" y="135" text-anchor="middle" class="t">Patient Interfaces</text>
  <text x="210" y="170" text-anchor="middle" class="s">TFT • Web Dashboard • Android App</text>

  <rect class="box" x="460" y="95" width="280" height="110"/>
  <text x="600" y="135" text-anchor="middle" class="t">Raspberry Pi</text>
  <text x="600" y="170" text-anchor="middle" class="s">Device controller + local services</text>

  <rect class="box" x="850" y="95" width="280" height="110"/>
  <text x="990" y="135" text-anchor="middle" class="t">Time & Network</text>
  <text x="990" y="170" text-anchor="middle" class="s">NTP • DS3231 RTC • Remote access</text>

  <rect class="box" x="70" y="315" width="250" height="125"/>
  <text x="195" y="355" text-anchor="middle" class="t">Backend</text>
  <text x="195" y="390" text-anchor="middle" class="s">Flask API</text>
  <text x="195" y="415" text-anchor="middle" class="s">SQLite • schedules • logs</text>

  <rect class="box" x="365" y="315" width="250" height="125"/>
  <text x="490" y="355" text-anchor="middle" class="t">Dispensing</text>
  <text x="490" y="390" text-anchor="middle" class="s">Stepper motors</text>
  <text x="490" y="415" text-anchor="middle" class="s">Compartments 1 • 3 • 5</text>

  <rect class="box" x="660" y="315" width="250" height="125"/>
  <text x="785" y="355" text-anchor="middle" class="t">Verification</text>
  <text x="785" y="390" text-anchor="middle" class="s">IR pill count • Camera</text>
  <text x="785" y="415" text-anchor="middle" class="s">AI-assisted classification</text>

  <rect class="box" x="955" y="315" width="180" height="125"/>
  <text x="1045" y="355" text-anchor="middle" class="t">Alerts</text>
  <text x="1045" y="390" text-anchor="middle" class="s">Buzzer</text>
  <text x="1045" y="415" text-anchor="middle" class="s">Status + acknowledgement</text>

  <rect class="box" x="365" y="545" width="470" height="105"/>
  <text x="600" y="585" text-anchor="middle" class="t">Medication Event Record</text>
  <text x="600" y="620" text-anchor="middle" class="s">Patient • medication • quantity • evidence • outcome • timestamp</text>

  <path class="l" d="M350 150 H460"/>
  <path class="l" d="M850 150 H740"/>
  <path class="l" d="M600 205 V270 H195 V315"/>
  <path class="l" d="M600 205 V315"/>
  <path class="l" d="M600 270 H785 V315"/>
  <path class="l" d="M600 270 H1045 V315"/>
  <path class="l" d="M195 440 V505 H600 V545"/>
  <path class="l" d="M490 440 V545"/>
  <path class="l" d="M785 440 V505 H600 V545"/>
</svg>