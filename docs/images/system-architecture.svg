<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#111111"/>
    </marker>
  </defs>
  <style>
    .title{font:700 30px Arial,sans-serif;fill:#111}
    .layer{font:700 15px Arial,sans-serif;letter-spacing:1.4px;fill:#555}
    .box{fill:#fff;stroke:#111;stroke-width:2.4;rx:12;ry:12}
    .core{fill:#f7f7f7;stroke:#111;stroke-width:3;rx:14;ry:14}
    .h{font:700 20px Arial,sans-serif;fill:#111}
    .s{font:15px Arial,sans-serif;fill:#333}
    .line{stroke:#111;stroke-width:2.4;fill:none;marker-end:url(#arrow);stroke-linecap:square;stroke-linejoin:miter}
    .bus{stroke:#111;stroke-width:2.4;fill:none;stroke-linecap:square;stroke-linejoin:miter}
  </style>

  <text x="700" y="48" text-anchor="middle" class="title">MedSystem — Smart Medication Dispenser Architecture</text>

  <text x="70" y="105" class="layer">USER INTERFACE LAYER</text>
  <rect class="box" x="120" y="130" width="300" height="100"/>
  <text x="270" y="168" text-anchor="middle" class="h">On-Device TFT</text>
  <text x="270" y="198" text-anchor="middle" class="s">Local setup, status and acknowledgement</text>

  <rect class="box" x="550" y="130" width="300" height="100"/>
  <text x="700" y="168" text-anchor="middle" class="h">Web Dashboard</text>
  <text x="700" y="198" text-anchor="middle" class="s">Patients, schedules, evidence and adherence</text>

  <rect class="box" x="980" y="130" width="300" height="100"/>
  <text x="1130" y="168" text-anchor="middle" class="h">Android App</text>
  <text x="1130" y="198" text-anchor="middle" class="s">Mobile medication management and monitoring</text>

  <text x="70" y="300" class="layer">APPLICATION & CONTROL LAYER</text>
  <rect class="core" x="425" y="325" width="550" height="135"/>
  <text x="700" y="365" text-anchor="middle" class="h">Raspberry Pi — MedSystem Controller</text>
  <text x="700" y="397" text-anchor="middle" class="s">Flask API • scheduling engine • device logic • local services</text>
  <text x="700" y="425" text-anchor="middle" class="s">SQLite records • evidence metadata • automatic dispense service</text>

  <path class="bus" d="M270 230 V275 H1130 V230"/>
  <path class="bus" d="M700 230 V275"/>
  <path class="line" d="M700 275 V325"/>

  <text x="70" y="525" class="layer">HARDWARE & VERIFICATION LAYER</text>

  <rect class="box" x="65" y="550" width="245" height="125"/>
  <text x="187" y="588" text-anchor="middle" class="h">Dispensing</text>
  <text x="187" y="619" text-anchor="middle" class="s">Stepper motors</text>
  <text x="187" y="645" text-anchor="middle" class="s">Active paths: 1, 3 and 5</text>

  <rect class="box" x="345" y="550" width="245" height="125"/>
  <text x="467" y="588" text-anchor="middle" class="h">Pill Counting</text>
  <text x="467" y="619" text-anchor="middle" class="s">IR sensors</text>
  <text x="467" y="645" text-anchor="middle" class="s">Clear → detect → re-arm</text>

  <rect class="box" x="625" y="550" width="245" height="125"/>
  <text x="747" y="588" text-anchor="middle" class="h">Verification</text>
  <text x="747" y="619" text-anchor="middle" class="s">Camera evidence</text>
  <text x="747" y="645" text-anchor="middle" class="s">AI-assisted classification</text>

  <rect class="box" x="905" y="550" width="205" height="125"/>
  <text x="1007" y="588" text-anchor="middle" class="h">Alerts</text>
  <text x="1007" y="619" text-anchor="middle" class="s">Buzzer</text>
  <text x="1007" y="645" text-anchor="middle" class="s">Dose-ready acknowledgement</text>

  <rect class="box" x="1145" y="550" width="205" height="125"/>
  <text x="1247" y="588" text-anchor="middle" class="h">Time</text>
  <text x="1247" y="619" text-anchor="middle" class="s">DS3231 RTC</text>
  <text x="1247" y="645" text-anchor="middle" class="s">NTP synchronization</text>

  <path class="bus" d="M700 460 V505 H187"/>
  <path class="bus" d="M700 505 H1247"/>
  <path class="line" d="M187 505 V550"/>
  <path class="line" d="M467 505 V550"/>
  <path class="line" d="M747 505 V550"/>
  <path class="line" d="M1007 505 V550"/>
  <path class="line" d="M1247 505 V550"/>

  <text x="70" y="750" class="layer">MEDICATION EVENT OUTPUT</text>
  <rect class="core" x="250" y="775" width="900" height="85"/>
  <text x="700" y="808" text-anchor="middle" class="h">Verified Medication Event Record</text>
  <text x="700" y="836" text-anchor="middle" class="s">Patient • medication • prescribed quantity • IR count • evidence • outcome • synchronized timestamp</text>

  <path class="bus" d="M187 675 V720 H1247"/>
  <path class="bus" d="M467 675 V720"/>
  <path class="bus" d="M747 675 V720"/>
  <path class="bus" d="M1007 675 V720"/>
  <path class="bus" d="M1247 675 V720"/>
  <path class="line" d="M700 720 V775"/>
</svg>